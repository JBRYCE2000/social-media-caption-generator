<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      color: #1a202c;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #2d3748;
    }

    .input-section {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
      margin-bottom: 24px;
    }

    .input-section label {
      display: block;
      font-size: .875rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      transition: border-color .15s;
      line-height: 1.6;
      color: #2d3748;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,.15);
    }

    textarea::placeholder { color: #a0aec0; }

    .hint {
      font-size: .8rem;
      color: #a0aec0;
      margin-top: 6px;
    }

    button.generate {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }

    button.generate:hover { opacity: .92; }
    button.generate:active { transform: scale(.99); }

    .list-section {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .list-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2d3748;
    }

    .stats {
      font-size: .8rem;
      color: #a0aec0;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f7fafc;
      cursor: pointer;
      user-select: none;
      transition: background .1s;
      border-radius: 6px;
      padding-left: 8px;
    }

    li:last-child { border-bottom: none; }

    li:hover { background: #f7fafc; }

    .checkbox {
      width: 20px;
      height: 20px;
      min-width: 20px;
      border-radius: 50%;
      border: 2px solid #cbd5e0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .15s, background .15s;
    }

    li.done .checkbox {
      border-color: #667eea;
      background: #667eea;
    }

    .checkmark {
      display: none;
      width: 10px;
      height: 10px;
    }

    li.done .checkmark { display: block; }

    .task-text {
      font-size: 1rem;
      color: #2d3748;
      transition: color .15s, text-decoration .15s;
      line-height: 1.5;
    }

    li.done .task-text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .empty {
      text-align: center;
      color: #a0aec0;
      font-size: .95rem;
      padding: 24px 0;
    }

    .clear-btn {
      font-size: .8rem;
      color: #fc8181;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background .15s;
    }

    .clear-btn:hover { background: #fff5f5; }
    .clear-btn:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <div class="container">
    <h1>To-Do List</h1>

    <div class="input-section">
      <label for="taskInput">Enter your tasks</label>
      <textarea
        id="taskInput"
        placeholder="Walk the dog&#10;Buy groceries&#10;Call dentist&#10;Read for 30 minutes"
      ></textarea>
      <p class="hint">One task per line — press the button to turn them into a list.</p>
      <button class="generate" onclick="buildList()">Build My List</button>
    </div>

    <div class="list-section">
      <div class="list-header">
        <h2>Tasks</h2>
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="stats" id="stats"></span>
          <button class="clear-btn" id="clearBtn" onclick="clearDone()" disabled>Clear done</button>
        </div>
      </div>
      <ul id="taskList">
        <li style="pointer-events:none;border:none;">
          <p class="empty">Your tasks will appear here.</p>
        </li>
      </ul>
    </div>
  </div>

  <script>
    let tasks = [];

    function buildList() {
      const raw = document.getElementById('taskInput').value;
      const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return;

      tasks = lines.map(text => ({ text, done: false }));
      render();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      render();
    }

    function clearDone() {
      tasks = tasks.filter(t => !t.done);
      render();
    }

    function render() {
      const list = document.getElementById('taskList');
      const stats = document.getElementById('stats');
      const clearBtn = document.getElementById('clearBtn');

      list.innerHTML = '';

      if (tasks.length === 0) {
        list.innerHTML = '<li style="pointer-events:none;border:none;"><p class="empty">No tasks yet. Add some above!</p></li>';
        stats.textContent = '';
        clearBtn.disabled = true;
        return;
      }

      const doneCount = tasks.filter(t => t.done).length;
      stats.textContent = `${doneCount} / ${tasks.length} done`;
      clearBtn.disabled = doneCount === 0;

      tasks.forEach((task, i) => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');
        li.onclick = () => toggleTask(i);

        li.innerHTML = `
          <div class="checkbox">
            <svg class="checkmark" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1.5 5L4 7.5L8.5 2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="task-text">${escapeHtml(task.text)}</span>
        `;

        list.appendChild(li);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
